name: Signed component publisher
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Immutable HTTPS directory for this version's assets
        required: true
        type: string
      feed_url:
        description: Stable HTTPS Host feed endpoint for preview/osx-arm64
        required: true
        type: string
      client_feed_url:
        description: Stable standalone client feed
        required: true
        type: string
      app_feed_url:
        description: Stable complete Mac app feed
        required: true
        type: string
      content_feed_url:
        description: Stable signed content envelope URL
        required: true
        type: string
permissions:
  contents: read
jobs:
  signed-mac:
    runs-on: macos-15
    environment: component-publishing
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - name: Require the latest core baseline
        run: python3 scripts/verify-core-baseline.py --upstream-ref origin/main
      - name: Build and verify unified signed candidates
        shell: bash
        env:
          COMPONENT_SIGNING_PRIVATE_KEY: ${{ secrets.COMPONENT_SIGNING_PRIVATE_KEY }}
          PCL_PUBLISH_BASE_URL: ${{ inputs.base_url }}
          PCL_HOST_FEED_URL: ${{ inputs.feed_url }}
          PCL_CLIENT_FEED_URL: ${{ inputs.client_feed_url }}
          PCL_APP_FEED_URL: ${{ inputs.app_feed_url }}
          PCL_CONTENT_FEED_URL: ${{ inputs.content_feed_url }}
        run: |
          key="$RUNNER_TEMP/pcl-publisher.pem"
          trap 'rm -f "$key"' EXIT
          python3 - "$key" <<'PYKEY'
          import os, sys
          secret = os.environ.get('COMPONENT_SIGNING_PRIVATE_KEY', '')
          if not secret:
              raise SystemExit('Configure COMPONENT_SIGNING_PRIVATE_KEY first')
          with os.fdopen(os.open(sys.argv[1], os.O_CREAT | os.O_EXCL | os.O_WRONLY, 0o600), 'w') as output:
              output.write(secret)
          PYKEY
          unset COMPONENT_SIGNING_PRIVATE_KEY
          PCL_PUBLISH_KEY="$key" DOTNET="$(command -v dotnet)" bash scripts/build-unified-release.sh "$PWD/artifacts/unified"
      # Upload for operator review. This never uploads a private key, replaces a
      # public feed, creates a GitHub Release, or asserts Developer ID notarization.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-macos-component-release
          path: |
            artifacts/unified/release/*.zip
            artifacts/unified/release/*.json
            artifacts/unified/release/*.pem
            artifacts/unified/release/SHA256SUMS
            artifacts/unified/verified/delivery-result.json
          if-no-files-found: error
          retention-days: 14
