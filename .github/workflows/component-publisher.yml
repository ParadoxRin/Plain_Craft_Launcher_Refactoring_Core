name: Signed component publisher
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Immutable HTTPS directory for this version's assets
        required: true
        type: string
      feed_url:
        description: Stable HTTPS Host feed endpoint for preview/osx-arm64
        required: true
        type: string
permissions:
  contents: read
jobs:
  signed-mac:
    runs-on: macos-15
    environment: component-publishing
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - name: Require the latest core baseline
        run: python3 scripts/verify-core-baseline.py --upstream-ref origin/main
      - name: Build native assets and component candidates
        run: |
          bash scripts/build-native.sh
          DOTNET="$(command -v dotnet)" bash scripts/build-components.sh osx-arm64
          dotnet build tools/Pcl.UpdatePack/Pcl.UpdatePack.csproj -c Release -m:1 -nr:false -p:UseSharedCompilation=false
      - name: Sign Host feed, index and installer with publisher identity
        shell: bash
        env:
          COMPONENT_SIGNING_PRIVATE_KEY: ${{ secrets.COMPONENT_SIGNING_PRIVATE_KEY }}
          PCL_PUBLISH_BASE_URL: ${{ inputs.base_url }}
          PCL_PUBLISH_FEED_URL: ${{ inputs.feed_url }}
        run: |
          key="$RUNNER_TEMP/pcl-publisher.pem"
          trap 'rm -f "$key"' EXIT
          python3 - "$key" <<'PY'
          import os, sys
          secret = os.environ.get('COMPONENT_SIGNING_PRIVATE_KEY', '')
          if not secret:
              raise SystemExit('Configure COMPONENT_SIGNING_PRIVATE_KEY in component-publishing first')
          descriptor = os.open(sys.argv[1], os.O_CREAT | os.O_EXCL | os.O_WRONLY, 0o600)
          with os.fdopen(descriptor, 'w') as stream:
              stream.write(secret)
          PY
          unset COMPONENT_SIGNING_PRIVATE_KEY
          version=$(python3 -c 'import json; print(json.load(open("release.json"))["version"])')
          python3 scripts/sign-component-release.py --work "artifacts/components-$version-osx-arm64" --release release.json --key "$key" --dotnet "$(command -v dotnet)" --tool tools/Pcl.UpdatePack/bin/Release/net10.0/Pcl.UpdatePack.dll --output artifacts/signed-components --base-url "$PCL_PUBLISH_BASE_URL" --feed-url "$PCL_PUBLISH_FEED_URL"
          PCL_HOST_UPDATE_POLICY="$PWD/artifacts/signed-components/host-update-policy.json" DOTNET="$(command -v dotnet)" bash scripts/build-release.sh
          python3 scripts/add-component-installer.py artifacts/signed-components "artifacts/Plain-Craft-Launcher-Refactoring-$version-macOS-arm64.zip" "$key" "$(command -v dotnet)" tools/Pcl.UpdatePack/bin/Release/net10.0/Pcl.UpdatePack.dll
      - name: Verify the actual signed delivery
        run: |
          dotnet build tests/Pcl.LogProtection.Tests/Pcl.LogProtection.Tests.csproj -c Release -m:1 -nr:false -p:UseSharedCompilation=false
          python3 scripts/verify-component-delivery.py artifacts/signed-components tests/Pcl.LogProtection.Tests/bin/Release/net10.0/Pcl.LogProtection.Tests.dll "$(command -v dotnet)" artifacts/signed-delivery
      # Upload for operator review. This never uploads a private key, replaces a
      # public feed, creates a GitHub Release, or asserts Developer ID notarization.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-macos-component-release
          path: |
            artifacts/signed-components/*.zip
            artifacts/signed-components/*.json
            artifacts/signed-components/*.pem
            artifacts/signed-components/SHA256SUMS
            artifacts/signed-delivery/delivery-result.json
          if-no-files-found: error
          retention-days: 14
