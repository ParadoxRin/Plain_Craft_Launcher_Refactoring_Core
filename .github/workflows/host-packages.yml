name: Independent Host packages
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'vendor/**'
      - 'scripts/build-host-package.sh'
      - 'scripts/package-host.py'
      - 'scripts/*component*'
      - 'scripts/verify-core-baseline.py'
      - 'release.json'
      - '.github/workflows/host-packages.yml'
permissions:
  contents: read
jobs:
  host:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, rid: osx-arm64}
          - {os: ubuntu-latest, rid: linux-x64}
          - {os: windows-latest, rid: win-x64}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - name: Check latest core baseline
        run: python3 scripts/verify-core-baseline.py --upstream-ref origin/main
      - name: Rebuild macOS native bridge
        if: runner.os == 'macOS'
        run: bash scripts/build-native.sh
      - name: Build only Host and its core dependencies
        run: DOTNET="$(command -v dotnet)" bash scripts/build-host-package.sh '${{ matrix.rid }}'
      - name: Verify shipped Core and private-pipe contract
        run: |
          version=$(python3 -c 'import json; print(json.load(open("release.json"))["version"])')
          dotnet build tests/Pcl.LogProtection.Tests/Pcl.LogProtection.Tests.csproj -c Release -m:1 -nr:false -p:UseSharedCompilation=false
          python3 scripts/verify-component-delivery.py "artifacts/host-package-$version-${{ matrix.rid }}/packages" tests/Pcl.LogProtection.Tests/bin/Release/net10.0/Pcl.LogProtection.Tests.dll "$(command -v dotnet)" artifacts/host-delivery
          dotnet build tests/Pcl.MinimalClient.Tests/Pcl.MinimalClient.Tests.csproj -c Release -m:1 -nr:false -p:UseSharedCompilation=false
          entry="$PWD/artifacts/host-delivery/host/Pcl.Host"
          if [ '${{ runner.os }}' = Windows ]; then entry="$entry.exe"; fi
          dotnet tests/Pcl.MinimalClient.Tests/bin/Release/net10.0/Pcl.MinimalClient.Tests.dll "$entry" - "$PWD/artifacts/host-contract-root" "$PWD/artifacts/host-contract.json" contract
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: host-${{ matrix.rid }}
          path: |
            artifacts/host-package-*/packages/*
            artifacts/host-delivery/delivery-result.json
            artifacts/host-contract.json
          if-no-files-found: error
          retention-days: 14
