name: Core CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'vendor/**'
      - 'tests/**'
      - 'examples/**'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/core-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'vendor/**'
      - 'tests/**'
      - 'examples/**'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/core-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Record runtime and source
        run: |
          git rev-parse HEAD
          dotnet --info
      - name: Restore and build core harness
        run: dotnet build tests/Pcl.Tests/Pcl.Tests.csproj --configuration Release -m:1 -nr:false
      # Pcl.Tests is a console executable, not a VSTest project. A successful
      # dotnet test invocation would not prove that its assertions ran.
      - name: Run core assertions
        run: dotnet tests/Pcl.Tests/bin/Release/net10.0/Pcl.Tests.dll artifacts/ci-core
      - name: Build real Host and independent minimal client
        run: |
          dotnet build src/Pcl.Host/Pcl.Host.csproj --configuration Release -m:1 -nr:false
          dotnet build tests/Pcl.MinimalClient.Tests/Pcl.MinimalClient.Tests.csproj --configuration Release -m:1 -nr:false
      # Fresh root, real private-pipe Host, public contracts only. This lane does
      # not perform a complete game download or access an OS credential store.
      - name: Run minimal client Host contract acceptance
        run: dotnet tests/Pcl.MinimalClient.Tests/bin/Release/net10.0/Pcl.MinimalClient.Tests.dll - "$PWD/src/Pcl.Host/bin/Release/net10.0/Pcl.Host.dll" "$PWD/artifacts/ci-minimal-root" "$PWD/artifacts/ci-minimal-result.json" contract
      - name: Build native credential acceptance
        run: dotnet build tests/Pcl.PlatformCredentials.Tests/Pcl.PlatformCredentials.Tests.csproj --configuration Release -m:1 -nr:false
      - name: Prepare Linux Secret Service dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsecret-1-0 gnome-keyring dbus-x11 libglib2.0-bin
      - name: Test Linux native credentials in private D-Bus session
        if: runner.os == 'Linux'
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/pcl-credential-data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/pcl-credential-config"
          export XDG_CACHE_HOME="$RUNNER_TEMP/pcl-credential-cache"
          export PCL_TEST_PRIVATE_SECRET_SERVICE=1
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          dbus-run-session -- bash -eu -c '
            printf "pcl-ci-fixture-only\n" | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            dotnet tests/Pcl.PlatformCredentials.Tests/bin/Release/net10.0/Pcl.PlatformCredentials.Tests.dll "$PWD/artifacts/ci-credential-root" "$PWD/artifacts/ci-credentials.json" "$PWD/src/Pcl.Host/bin/Release/net10.0/Pcl.Host.dll"
          '
      - name: Test Windows native credentials
        if: runner.os == 'Windows'
        run: dotnet tests/Pcl.PlatformCredentials.Tests/bin/Release/net10.0/Pcl.PlatformCredentials.Tests.dll "$PWD/artifacts/ci-credential-root" "$PWD/artifacts/ci-credentials.json" "$PWD/src/Pcl.Host/bin/Release/net10.0/Pcl.Host.dll"
      - name: Test macOS credentials in temporary keychain
        if: runner.os == 'macOS'
        run: |
          KEYCHAIN="$RUNNER_TEMP/pcl-native-test.keychain-db"
          ORIGINAL_KEYCHAIN=$(security default-keychain -d user | xargs)
          cleanup() {
            security default-keychain -d user -s "$ORIGINAL_KEYCHAIN"
            security delete-keychain "$KEYCHAIN"
          }
          security create-keychain -p pcl-ci-fixture-only "$KEYCHAIN"
          trap cleanup EXIT
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p pcl-ci-fixture-only "$KEYCHAIN"
          security default-keychain -d user -s "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "$ORIGINAL_KEYCHAIN"
          dotnet tests/Pcl.PlatformCredentials.Tests/bin/Release/net10.0/Pcl.PlatformCredentials.Tests.dll "$PWD/artifacts/ci-credential-root" "$PWD/artifacts/ci-credentials.json" "$PWD/src/Pcl.Host/bin/Release/net10.0/Pcl.Host.dll"
      - name: Upload bounded native credential report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: credentials-${{ matrix.os }}
          path: artifacts/ci-credentials.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload bounded minimal client report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: minimal-client-${{ matrix.os }}
          path: artifacts/ci-minimal-result.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload bounded test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-results-${{ matrix.os }}
          path: artifacts/ci-core/test-results.json
          if-no-files-found: warn
          retention-days: 14
