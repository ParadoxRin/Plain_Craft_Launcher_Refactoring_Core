name: Component package candidates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/*component*'
      - 'src/Pcl.Desktop/Pcl.Desktop.csproj'
      - 'src/Pcl.Core/**'
      - 'src/Pcl.Host/**'
      - 'src/Pcl.Client/**'
      - 'src/Pcl.Contract/**'
      - 'src/Pcl.Native/**'
      - 'tests/Pcl.LogProtection.Tests/**'
      - 'release.json'
      - 'tools/Pcl.UpdatePack/**'
      - 'tests/Pcl.ComponentDelivery.Tests/**'
      - 'scripts/verify-core-baseline.py'
      - 'scripts/build-release.sh'
      - 'scripts/package-macos.py'
      - 'scripts/package-app-archive.py'
      - 'Directory.Build.props'
      - '.github/workflows/component-packages.yml'

permissions:
  contents: read

jobs:
  mac-components:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Check latest core baseline
        run: python3 scripts/verify-core-baseline.py --upstream-ref origin/main
      - name: Verify package boundaries and failure cases
        run: python3 scripts/test-component-packages.py
      - name: Build native assets
        run: bash scripts/build-native.sh
      - name: Publish independent client and Host candidates
        run: DOTNET="$(command -v dotnet)" bash scripts/build-components.sh osx-arm64
      - name: Verify actual signed publisher outputs with a disposable key
        shell: bash
        run: |
          version=$(python3 -c 'import json; print(json.load(open("release.json"))["version"])')
          key="$RUNNER_TEMP/pcl-signing-fixture.pem"
          trap 'rm -f "$key"' EXIT
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$key"
          openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/pcl-signing-fixture-public.pem"
          dotnet build tools/Pcl.UpdatePack/Pcl.UpdatePack.csproj -c Release -m:1 -nr:false -p:UseSharedCompilation=false
          python3 scripts/sign-component-release.py --work "artifacts/components-$version-osx-arm64" --release release.json --key "$key" --dotnet "$(command -v dotnet)" --tool tools/Pcl.UpdatePack/bin/Release/net10.0/Pcl.UpdatePack.dll --output artifacts/signing-fixture --base-url "https://updates.example/$version/osx-arm64" --feed-url https://updates.example/preview/osx-arm64/feed.json
          PCL_RELEASE_OUTPUT="$PWD/artifacts/signing-installer" PCL_HOST_UPDATE_POLICY="$PWD/artifacts/signing-fixture/host-update-policy.json" DOTNET="$(command -v dotnet)" bash scripts/build-release.sh
          python3 scripts/add-component-installer.py artifacts/signing-fixture "artifacts/signing-installer/Plain-Craft-Launcher-Refactoring-$version-macOS-arm64.zip" "$key" "$(command -v dotnet)" tools/Pcl.UpdatePack/bin/Release/net10.0/Pcl.UpdatePack.dll
          dotnet build tests/Pcl.LogProtection.Tests/Pcl.LogProtection.Tests.csproj -c Release -m:1 -nr:false -p:UseSharedCompilation=false
          python3 scripts/verify-component-delivery.py artifacts/signing-fixture tests/Pcl.LogProtection.Tests/bin/Release/net10.0/Pcl.LogProtection.Tests.dll "$(command -v dotnet)" artifacts/signing-delivery
          dotnet publish src/Pcl.Host/Pcl.Host.csproj -c Release -r osx-arm64 --self-contained true -p:Version=0.42.0 -p:HostUpdateSequence=42000 -p:UseSharedCompilation=false -o artifacts/signing-baseline -m:1 -nr:false
          dotnet build tests/Pcl.ComponentDelivery.Tests/Pcl.ComponentDelivery.Tests.csproj -c Release -m:1 -nr:false -p:UseSharedCompilation=false
          dotnet tests/Pcl.ComponentDelivery.Tests/bin/Release/net10.0/Pcl.ComponentDelivery.Tests.dll "$PWD/artifacts/signing-fixture" "$PWD/artifacts/signing-baseline/Pcl.Host" "$RUNNER_TEMP/pcl-signing-fixture-public.pem" "$PWD/artifacts/signing-test-root" "$PWD/artifacts/signing-result.json"
      - name: Verify extracted packages and shipped Core regressions
        shell: bash
        run: |
          version=$(python3 -c 'import json; print(json.load(open("release.json"))["version"])')
          dotnet build tests/Pcl.LogProtection.Tests/Pcl.LogProtection.Tests.csproj -c Release -m:1 -nr:false -p:UseSharedCompilation=false
          python3 scripts/verify-component-delivery.py "artifacts/components-$version-osx-arm64/packages" tests/Pcl.LogProtection.Tests/bin/Release/net10.0/Pcl.LogProtection.Tests.dll "$(command -v dotnet)" artifacts/component-delivery
      - name: Verify private-pipe contract with packaged Host
        shell: bash
        run: |
          version=$(python3 -c 'import json; print(json.load(open("release.json"))["version"])')
          dotnet build tests/Pcl.MinimalClient.Tests/Pcl.MinimalClient.Tests.csproj -c Release -m:1 -nr:false
          dotnet tests/Pcl.MinimalClient.Tests/bin/Release/net10.0/Pcl.MinimalClient.Tests.dll "$PWD/artifacts/component-delivery/full/host/Pcl.Host" - "$PWD/artifacts/component-contract-root" "$PWD/artifacts/component-contract.json" contract
      # Candidates are not Developer ID signed/notarized production releases.
      # Production Host signing/feed creation runs on a trusted publisher machine.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-arm64-component-candidates
          path: |
            artifacts/components-*/packages/*
            artifacts/component-contract.json
            artifacts/component-delivery/delivery-result.json
            artifacts/signing-result.json
            artifacts/signing-delivery/delivery-result.json
          if-no-files-found: error
          retention-days: 14
